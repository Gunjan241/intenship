<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart ToDo List</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</head>

<body>

    <div class="container">

        <h1>
            📝 Smart To Do List
        </h1>

        <p class="subtitle">
            Manage your daily tasks easily
        </p>

        <div class="input-box">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter Your Task">

            <button id="addBtn">
                ➕ Add Task
            </button>

        </div>

        <button id="themeBtn">
            🌙 Change Theme
        </button>

        <h3>
            Total Tasks :
            <span id="count">0</span>
        </h3>

        <ul id="taskList">

        </ul>

        <div class="footer">

            <p>
                Developed Using jQuery ❤️
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
